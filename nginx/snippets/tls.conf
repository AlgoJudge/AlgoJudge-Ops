# TLS, and where the certificate comes from.
#
# **The administrator supplies it and this stack only reads it.** Nothing here
# issues, renews or stores a certificate; `certs/` is mounted `:ro`. Renewal is
# whatever the installation already uses, and `/.well-known/acme-challenge/` is
# served on both ports so an HTTP-01 challenge is never redirected away.
#
# `scripts/render-tls.sh` writes a **self-signed** pair here when the directory
# is empty. That is not a certificate: it exists so that a first `up` produces a
# working instance with a browser warning, instead of an nginx that will not
# start and an error nobody can act on.

ssl_certificate     /etc/nginx/certs/fullchain.pem;
ssl_certificate_key /etc/nginx/certs/privkey.pem;

# 1.2 and 1.3. 1.0 and 1.1 are deprecated and no browser this product supports
# needs them.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# **Off, deliberately.** Stapling needs a resolver and a chain nginx can verify,
# and a self-signed pair has neither — with it on, every start logs an OCSP
# error that means nothing. An installation with a real certificate and a
# resolver configured can turn it on; `docs/OPERATIONS.md` says how.
ssl_stapling off;
