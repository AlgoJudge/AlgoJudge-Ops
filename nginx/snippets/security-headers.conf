# The headers, and the one that is deliberately absent.
#
# Matched to what `AlgoJudge-Website/deployment/apache/.htaccess` already sends,
# so an installation and the informational site do not disagree about their own
# product.
#
# `always`, on every one of them: without it nginx omits the header on error
# responses, which are exactly the ones an attacker can most easily provoke.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header X-Frame-Options           "SAMEORIGIN" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;

# **No `Content-Security-Policy`, and that is a decision rather than an
# oversight.** The Client image writes its runtime configuration into
# `index.html` as an inline `<script>` at container start, so a policy strict
# enough to be worth having needs a nonce nothing in the Client emits. Closing
# it belongs in `AlgoJudge-Client`, where that entrypoint is.

# **`SAMEORIGIN` refuses a foreign LMS exactly as `DENY` would**, so it is
# correct only where an LMS and this application are served from one origin,
# routed by path. Relaxing the frame policy of every installation by default is
# not a decision this file takes on anybody's behalf.
#
# **An installation whose LMS is on another name must replace this line.**
# `X-Frame-Options` cannot name a foreign origin; `Content-Security-Policy` can:
#
#     add_header Content-Security-Policy "frame-ancestors https://moodle.example.edu" always;
#
# naming every platform allowed to frame this installation, and dropping the
# `X-Frame-Options` line so the two do not disagree.
