# The headers, and the one that is deliberately absent.
#
# Matched to what `AlgoJudge-Website/deployment/apache/.htaccess` already sends,
# so an installation and the informational site do not disagree about their own
# product.
#
# `always`, on every one of them: without it nginx omits the header on error
# responses, which are exactly the ones an attacker can most easily provoke.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header X-Frame-Options           "SAMEORIGIN" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;

# **No `Content-Security-Policy`, and that is a decision rather than an
# oversight.** The Client image writes its runtime configuration into
# `index.html` as an inline `<script>` at container start — that is what makes
# one image serve any installation — and a policy strict enough to be worth
# having would need a nonce on it. Nothing in the Client emits one, so a CSP here
# would either break the application or be `unsafe-inline`, which is a header
# that says nothing.
#
# Closing it belongs in `AlgoJudge-Client`, where the entrypoint that writes the
# script is. Recorded as an open question in `docs/specs/DEPLOYMENT.md` rather
# than answered here with a policy that does not hold.

# **`SAMEORIGIN`, and it does not cover the LTI case it used to be justified by.**
#
# This said `SAMEORIGIN` was the strictest value compatible with LTI. It is not
# compatible with it at all in the ordinary arrangement. Measured 2026-09-01 in a
# browser: with this header a page on the **same** origin frames the application,
# and a page on **another** origin is refused. An LTI launch comes from the LMS,
# so a Moodle at `moodle.example.edu` framing this application at
# `algojudge.example.edu` is refused exactly as `DENY` would refuse it.
#
# **It stays, for two reasons.** It is correct for the installations it does
# cover — an LMS and this application served from one origin, routed by path —
# and relaxing the frame policy of every installation by default is not a
# decision this file should take on anybody's behalf.
#
# **An installation whose LMS is on another name must replace this line.**
# `X-Frame-Options` cannot name a foreign origin; `Content-Security-Policy` can:
#
#     add_header Content-Security-Policy "frame-ancestors https://moodle.example.edu" always;
#
# naming every platform allowed to frame this installation, and dropping the
# `X-Frame-Options` line so the two do not disagree. `docs/INSTALL.md` says the
# same where LTI is described.
#
# Note what that costs elsewhere: there is no `Content-Security-Policy` here
# otherwise, for the reason above, so this header is the whole of the frame
# policy an installation gets by default.
