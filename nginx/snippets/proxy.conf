# What every proxied request carries.
#
# **`X-Forwarded-For` is the reason the `edge` network has a fixed subnet.** The
# Server records where a request came from and refuses to start unless it has
# been told whose word to take for it — `AJ_Forwarded__KnownNetworks`. Setting
# the header here and not naming this proxy there means every visitor's address
# is recorded as this container's.

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

# **Load-bearing.** Without it the Server sees `http`, and `UseHttpsRedirection`
# answers a redirect to itself — an infinite loop that looks like the
# application never loading.
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

proxy_connect_timeout 5s;
proxy_send_timeout    60s;

# **`proxy_read_timeout` is deliberately not here.** `include` puts a directive
# in the including block, and nginx refuses a duplicate outright — so a value
# here plus the long one the API route needs for its WebSocket is an `[emerg]`
# at start rather than an override. Each location sets its own.

# Off for both halves: the Client streams nothing, and the Server's downloads are
# already streamed and would be pointlessly spooled to disk first.
proxy_buffering off;
proxy_request_buffering off;

# **`proxy_buffering off` above does not cover the response headers**, and that
# is the trap. Headers always have to fit in `proxy_buffer_size` — 4k by
# default — and nginx answers **502** when they do not, logging `upstream sent
# too big header`. Nothing in the response reaches the browser, so it reads as
# an upstream that fell over.
#
# The response that gets close is the one that ends a federated sign-in: it
# carries `.AspNetCore.Correlation.*` and `.AspNetCore.OpenIdConnect.Nonce.*`
# being deleted alongside `.AspNetCore.Identity.Application` being set, and that
# last one is chunked into `C1`, `C2` when the claims make it large enough.
#
# **Measured 2026-09-01 against Keycloak behind this same snippet**, where the
# authorization response sets `AUTH_SESSION_ID`, `KC_AUTH_SESSION_HASH` and
# `KC_RESTART` — the last a JWT — and 4k was not enough: every sign-in ended
# 502. **Not reproduced against this stack's own edge**, because the bundled
# nginx does not proxy an identity product; it is raised here because the shape
# of the failing response is the same one this stack's Server sends, and 16k
# costs nothing to be wrong about.
proxy_buffer_size       16k;
proxy_buffers         4 16k;
proxy_busy_buffers_size 16k;
