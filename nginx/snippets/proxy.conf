# What every proxied request carries.
#
# **`X-Forwarded-For` is the reason the `edge` network has a fixed subnet.** The
# Server refuses to start unless it has been told whose word to take for a
# client address — `AJ_Forwarded__KnownNetworks`. Setting the header here and
# not naming this proxy there records every visitor as this container.

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

# **Load-bearing.** Without it the Server sees `http`, and `UseHttpsRedirection`
# answers a redirect to itself — an infinite loop that looks like the
# application never loading.
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

proxy_connect_timeout 5s;
proxy_send_timeout    60s;

# **`proxy_read_timeout` is deliberately not here.** `include` puts a directive
# in the including block, and nginx refuses a duplicate outright — so a value
# here plus the long one the API route needs for its WebSocket is an `[emerg]`
# at start rather than an override. Each location sets its own.

# Off for both halves: the Client streams nothing, and the Server's downloads are
# already streamed and would be pointlessly spooled to disk first.
proxy_buffering off;
proxy_request_buffering off;

# **`proxy_buffering off` above does not cover the response headers.** They must
# fit in `proxy_buffer_size` — 4k by default — or nginx answers **502**, logging
# `upstream sent too big header`. Nothing reaches the browser, so it reads as an
# upstream that fell over.
#
# The response that gets close is the one that ends a federated sign-in:
# `.AspNetCore.Correlation.*` and `.AspNetCore.OpenIdConnect.Nonce.*` deleted
# alongside `.AspNetCore.Identity.Application` set, itself chunked into `C1`,
# `C2` when the claims make it large enough.
proxy_buffer_size       16k;
proxy_buffers         4 16k;
proxy_busy_buffers_size 16k;
