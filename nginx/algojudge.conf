# The edge: TLS, one origin for both halves, and nothing clever.
#
# **One origin is the whole design.** The application at `/` and the API at
# `/api/v1` on the same host means the Client is configured `API_BASE_URL=/`,
# the browser makes same-origin requests, and there is no CORS to get wrong. An
# installation that splits them across two domains works too and has to
# configure `AJ_Cors__AllowedOrigins` — see `docs/INSTALL.md`.
#
# **No `server_name`, and no template.** One certificate, one site, so `_` matches
# whatever the installation is called and `$host` carries it into the redirect.
# This file is mounted as it is: there is no `envsubst` pass, no generated
# config, and therefore nothing that can be generated wrong.

# **`$connection_upgrade` has to be defined somewhere**, and this file is
# included in the `http` context, so here. Without it the variable is empty and
# the event socket never upgrades — the Client then falls back to REST and
# nothing looks broken except that nothing arrives on its own.
# **The empty case is "" and not "close", which is not nginx's own websocket
# example and is deliberate.** `upstream algojudge_server` declares
# `keepalive 16`, and nginx only reuses an upstream connection when the
# `Connection` header going to the backend is cleared. Mapping the ordinary
# request — one with no `Upgrade` — to `close` tells the Server to hang up
# after every reply, so the pool above holds nothing and each claim, heartbeat,
# report and file download costs a fresh connection. An empty value makes nginx
# omit the header, which is what the keepalive documentation asks for, and the
# upgrade case is untouched.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

# ── Upstreams ─────────────────────────────────────────────────────────────────
#
# `max_fails` and `fail_timeout` so a dead container is marked quickly instead of
# costing a connection timeout on every request.

upstream algojudge_server {
    server server:8080 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

upstream algojudge_client {
    server client:80 max_fails=3 fail_timeout=10s;
    keepalive 8;
}

# ── Port 80 ───────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # **Never redirected**, or a certificate cannot be renewed once HSTS is in
    # force. Served from a directory the administrator's own ACME client writes.
    location /.well-known/acme-challenge/ {
        root /srv/acme;
    }

    # This container's own health check. Answered on port 80 so it needs no
    # certificate, and it says nothing about the upstreams — `/api/v1/health`
    # is what says whether the Server is up.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

# ── Port 443 ──────────────────────────────────────────────────────────────────

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;

    # Matched to the Server's own `Limits:MaxRequestBytes`. Whichever is smaller
    # is the real ceiling, and the one that refuses without a usable message
    # should not be this one: over the limit nginx answers 413 itself, with an
    # HTML body the Client cannot read as `problem+json`.
    client_max_body_size 128m;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /.well-known/acme-challenge/ {
        root /srv/acme;
    }

    # ── The operator's surface, which is not on the network ───────────────────
    #
    # **Refused here, and it would be refused there too.** `/api/v1/admin/**`
    # answers only on the Server's own loopback interface, and a request through
    # this proxy arrives inside that container as the bridge gateway — so it
    # would get the same 404 one hop later. `aj-admin` is reached with
    # `docker compose exec`, and that is the whole of the supported way in.
    location /api/v1/admin {
        return 404;
    }

    # ── The API ───────────────────────────────────────────────────────────────

    location /api/v1/ {
        proxy_pass http://algojudge_server;
        include /etc/nginx/snippets/proxy.conf;

        # **`proxy_intercept_errors` stays off here, and that is the maintenance
        # design.** The Server refuses with `503`, `Retry-After` and a
        # `server.maintenance` body during a window, and the Client turns exactly
        # that into its own maintenance page and polls `/api/v1/health` to learn
        # it may come back. Replacing it with static HTML from this proxy would
        # break the page, hide the reason, and defeat the drain — a backup would
        # start while a Runner was still writing a result.
        proxy_intercept_errors off;

        # The event socket is `/api/v1/ws` — under the same prefix, so it needs
        # no location of its own, only the upgrade headers and a read timeout
        # longer than a quiet socket.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # ── The application ───────────────────────────────────────────────────────

    location / {
        proxy_pass http://algojudge_client;
        include /etc/nginx/snippets/proxy.conf;

        # **`keepalive 8` above did nothing without these two.** nginx 1.27
        # proxies with HTTP/1.0 by default and sends `Connection: close`, so
        # every asset the browser pulls — the bundle, each hashed file, each
        # locale — cost a fresh connection to the Client container. The same
        # defect the API route carried until 2026-09-04, one location down.
        #
        # Set here rather than in `snippets/proxy.conf`: the API route already
        # sets both, and nginx refuses a duplicate from an include exactly as it
        # would refuse a second `proxy_read_timeout` — the trap that file warns
        # about in place.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # **On here, and only here.** This is the one case a static page helps:
        # the Client container is gone, so the browser gets a connection error
        # and no application to show a message with. 502 and 504 only — never
        # 503, which is the Server speaking through the API above and is not
        # this route's to intercept.
        proxy_intercept_errors on;
        error_page 502 504 = @offline;
    }

    location @offline {
        root /srv/offline;
        try_files /index.html =502;
        add_header Retry-After 30 always;
        add_header Cache-Control "no-store" always;
        internal;
    }
}
