<!--
  Shown when the *Client* container is not there — never during maintenance.
  A maintenance window is the Server answering 503, which the application turns
  into its own page in its own language; this one only exists for the case where
  there is no application to show anything at all.

  No stylesheet, no font, no script, and no request of any kind: it has to work
  precisely when nothing else does, and every external file is one more thing
  that would also fail. The drawing is inline for exactly that reason: a
  separate image file would need an nginx location of its own that is correct
  at the very moment the upstream is gone, and this page is served for every
  address that fails, so a relative path would resolve differently on each.

  The picture is AlgoJudge-Assets `illustrations/hero.png`, resized to 560 px
  and quantised to a 128-colour palette. Regenerate it the same way if the
  drawing changes; it is decoration, so `alt` is empty on purpose.
