# The AlgoJudge stack, as an installation runs it.
#
#     cp .env.example .env      # then fill in the values it says are required
#     ./scripts/preflight.sh    # refuses now rather than half way up
#     docker compose up -d --wait
#
# **One file, and the topology is chosen with `COMPOSE_PROFILES` in `.env`.**
# Three files would mean three copies of every network, volume, health check and
# variable, and a change remembered in all of them or in none. See `docs/INSTALL.md`
# for the four arrangements this supports.
#
# **Nothing here is built.** Every image is pulled by tag from GHCR and the tag is
# a variable, so an update is `docker compose pull` and a rollback is a digest —
# see `scripts/update.sh`. The development stacks that build from source live in
# the product repositories and are labelled as development there.

name: algojudge

# **A bound on the log, because the daemon's own default has none.** Left to
# itself Docker writes a `json-file` until the disk is full: a contest's worth of
# judging is tens of thousands of lines per Runner, and nothing here or in
# `scripts/gc.sh` rotates it. The failure is the worst kind — the installation
# stops because the volume it shares with PostgreSQL is full, and the reason is
# in the file that filled it.
#
# **`local` rather than `json-file`.** It is Docker's own driver for the case
# where nobody is going to read the file by hand: it is bounded whether or not
# anybody says so, it compresses what it rotates, and it costs less to write
# because it does not JSON-escape and stamp every line. Twenty megabytes times
# five holds several times the history the old ten-times-three did, for about the
# same disk.
#
# **What changes for an operator, and it is one thing.** `docker logs` and
# `docker compose logs` read `local` exactly as before — the commands in
# `docs/OPERATIONS.md` are unaffected. But the file on disk is a compact binary
# format, so **a collector that tails `*-json.log` off the host filesystem stops
# finding anything.** That is the one reason to put `json-file` back, and it is
# the operator's call; nothing here can detect it.
#
# `docker compose logs` still reads only what is kept, so a diagnosis wants
# collecting before the window closes.
x-logging: &logging
  driver: local
  options:
    max-size: ${LOG_MAX_SIZE:-20m}
    max-file: "${LOG_MAX_FILES:-5}"

services:

  # ── The database ────────────────────────────────────────────────────────────

  postgres:
    profiles: ["data"]
    image: postgres:${POSTGRES_TAG:-18}
    logging: *logging
    restart: unless-stopped

    # **The volume is one level above PGDATA and that is not a typo.**
    # PostgreSQL 18 keeps its data in `/var/lib/postgresql/18/docker`, so the
    # volume belongs at `/var/lib/postgresql`. Mounting the old
    # `/var/lib/postgresql/data` makes the container refuse to start.
    volumes:
      - pgdata:/var/lib/postgresql

    # **No host port, in any topology.** Everything that needs the database is on
    # the `backend` network. A dump is taken through `docker compose exec`, which
    # needs no port — see `scripts/backup.sh`.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-algojudge}
      POSTGRES_USER: ${POSTGRES_USER:-algojudge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — see .env.example}

    healthcheck:
      # `-U` and `-d` both, or `pg_isready` reports the *server* is up while the
      # role and database the Server connects as do not exist yet. `$$` escapes
      # the substitution so Compose leaves it for the shell in the container.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-algojudge} -d $${POSTGRES_DB:-algojudge}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - backend

  # ── The Server ──────────────────────────────────────────────────────────────

  server:
    profiles: ["app", "server"]
    image: ${REGISTRY:-ghcr.io/algojudge}/algojudge-server:${SERVER_TAG:-0}
    logging: *logging

    # **Long enough to answer the claims it is holding.** Since 2026-09-04 a
    # Runner may ask the Server to hold a `claim` open — twenty-five seconds by
    # default, up to three hundred — and Compose's own default gives a container
    # ten seconds before SIGKILL. Every `docker compose up -d` with a new image
    # therefore killed the process with those requests parked in the wait.
    #
    # Nothing was lost: a waiting claim holds no transaction and no lease. What
    # it cost was a burst of reset connections in every Runner's log on every
    # update, where a 204 would have been the honest answer. Forty seconds
    # covers the shipped wait with room; an installation that raised
    # `AJ_Poll__WaitSeconds` should raise this beside it — to at most three
    # hundred, which is this Server's ceiling and which a Runner asking past
    # refuses to start against.
    stop_grace_period: ${SERVER_STOP_GRACE:-40s}
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      # Production is the default when this is absent, but an installation should
      # not depend on a default for the setting that decides whether the demo
      # world gets seeded.
      DOTNET_ENVIRONMENT: Production

      # **Warning in production, and this is how to see more.** The image ships
      # `Warning` because every SQL statement EF Core runs is emitted at
      # `Information` — measured at 91-98% of everything a judging stack writes.
      # The Runners have `RUNNER_LOG` for the same job; this is the Server's.
      #
      # `Information` brings the SQL back and is what to set while diagnosing
      # something and nothing else. Raise the log's own bound with it if the
      # window matters: at `Information` ten megabytes is minutes, not days.
      AJ_Logging__LogLevel__Default: ${SERVER_LOG:-Warning}

      AJ_ConnectionStrings__DbConnectionString: >-
        Host=postgres;Database=${POSTGRES_DB:-algojudge};Username=${POSTGRES_USER:-algojudge};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — see .env.example}

      # **Without this there is no way into a new installation.** `/admin` is
      # closed while it is empty, and that includes the endpoint that sets the
      # administrator's password — which is otherwise twenty random characters
      # nobody was told. `docs/INSTALL.md` opens with it.
      AJ_Admin__Token: ${AJ_ADMIN_TOKEN:?AJ_ADMIN_TOKEN is required — see .env.example}

      # **An installation that names no trusted proxy does not start.** Trusting
      # every sender of `X-Forwarded-For` lets a visitor state their own address;
      # trusting only loopback records the proxy. This names the network nginx
      # reaches the Server from, which is why `edge` has a fixed subnet below.
      # Behind somebody else's proxy (T3), set it to theirs.
      AJ_Forwarded__KnownNetworks: ${TRUSTED_PROXY_NETWORKS:-172.28.0.0/24}

      # Where a **browser** reaches the application. Empty is right on one
      # origin; on two, a federated sign-in ends at a bare `/activities`
      # resolved against the API's origin.
      AJ_App__BaseUrl: ${APP_BASE_URL:-}

      # **One store, in the database, by default** — which is what makes a single
      # `pg_dump` a complete backup. `filesystem` and `s3` are supported and cost
      # a second thing to back up; `docs/OPERATIONS.md` says what changes.
      AJ_Storage__Stores__objects__Kind: ${STORAGE_KIND:-postgres}
      AJ_Storage__Default: objects

      # Read only by the kind that asks for them, so all four stay empty under
      # the default. Without them `filesystem` and `s3` could not start at all.
      AJ_Storage__Stores__objects__Path: ${STORAGE_PATH:-/var/lib/algojudge/objects}
      AJ_Storage__Stores__objects__Endpoint: ${STORAGE_ENDPOINT:-}
      AJ_Storage__Stores__objects__Bucket: ${STORAGE_BUCKET:-}
      AJ_Storage__Stores__objects__AccessKey: ${STORAGE_ACCESS_KEY:-}
      AJ_Storage__Stores__objects__SecretKey: ${STORAGE_SECRET_KEY:-}

      # Applies the schema at start. Off in the Server by default: a schema change
      # is a decision somebody makes, and `scripts/update.sh` backs up before it.
      AJ_Database__MigrateOnStart: ${MIGRATE_ON_START:-true}

      # Read once, at the first start of an empty database, from the directory
      # mounted below. Absent means the panel is the only way to configure this
      # installation. See `docs/INSTALL.md`.
      AJ_Preconfiguration__Path: /etc/algojudge/preconfig

    volumes:
      # Optional, and `:ro`. The directory exists in this repository so the mount
      # never fails; an empty one configures nothing.
      - ./preconfig:/etc/algojudge/preconfig:ro
      # Mounted whatever `STORAGE_KIND` is: Compose cannot mount conditionally,
      # and a `filesystem` store on the container layer loses every file on the
      # next `up -d`.
      - objects:/var/lib/algojudge/objects

    # **Loopback only, and it is not conditional on the topology.** Compose
    # cannot publish a port for some profiles and not others, so this is bound to
    # `127.0.0.1` in every arrangement rather than opened in one of them. It is
    # not a way into `/admin`: a connection made to the host's own loopback
    # arrives inside the container as the bridge gateway, so `Peer.IsLoopback` is
    # false and the whole group answers 404.
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"

    # From the image: it asks `/api/v1/health` over bash's `/dev/tcp`, because
    # the image has no curl and no wget. Do not override it with one that uses
    # either.

    networks:
      - edge
      - backend
      - runner

  # ── The Client ──────────────────────────────────────────────────────────────

  client:
    profiles: ["app", "client"]
    image: ${REGISTRY:-ghcr.io/algojudge}/algojudge-client:${CLIENT_TAG:-0}
    logging: *logging
    restart: unless-stopped

    environment:
      # **`/` means "the origin this page came from"**, which is the case nginx
      # below creates: one domain serving the application at `/` and the API at
      # `/api/v1`. The Client appends the path itself — it is fixed on every
      # installation — so this names an origin and never a path.
      #
      # Serving the two from different origins is supported: put the Server's
      # public address here, and add that origin to `AJ_Cors__AllowedOrigins`.
      API_BASE_URL: ${API_BASE_URL:-/}
      USE_FAKE_API: "false"

    ports:
      - "127.0.0.1:${CLIENT_PORT:-8082}:80"

    networks:
      - edge

  # ── The edge ────────────────────────────────────────────────────────────────

  nginx:
    profiles: ["edge"]
    image: nginx:${NGINX_TAG:-1.27-alpine}
    logging: *logging
    restart: unless-stopped

    depends_on:
      # Started, not healthy: nginx has an answer for an upstream that is not
      # there yet, and waiting would make a slow Server a failed `up`.
      server:
        condition: service_started
      client:
        condition: service_started

    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"

    volumes:
      - ./nginx/algojudge.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/offline:/srv/offline:ro
      # Read-only, and supplied by the administrator. `scripts/render-tls.sh`
      # writes a self-signed pair here if it is empty, so a first start produces
      # a working instance with a browser warning rather than a container that
      # will not start.
      - ./certs:/etc/nginx/certs:ro
      # Served at `/.well-known/acme-challenge/`, so a certificate can be renewed
      # by whatever the administrator already uses. Nothing here issues one.
      - ./certs/acme:/srv/acme:ro

    healthcheck:
      # Against its own HTTP listener rather than the upstreams: this says nginx
      # is serving, and `/api/v1/health` says whether the Server is.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    networks:
      - edge

  # ── The Runner ──────────────────────────────────────────────────────────────

  runner-1: &runner
    profiles: ["runner"]
    image: ${REGISTRY:-ghcr.io/algojudge}/algojudge-runner:${RUNNER_TAG:-0}
    logging: *logging
    restart: unless-stopped

    # **No `depends_on` on the Server, deliberately.** This profile has to start
    # on its own on a separate host, where there is no Server service to depend
    # on. The Runner retries its own connection.

    environment: &runner-env
      # Must carry `/api/v1`; the Runner refuses at startup without it. On the
      # same host this is the container name, and on a Runner-only host it is the
      # installation's public HTTPS address.
      AJ_Server__BaseUrl: ${SERVER_URL:-http://server:8080}/api/v1

      AJ_Runner__Name: ${RUNNER_NAME_PREFIX:-runner}-1
      AJ_Runner__ProblemTypes: ${RUNNER_PROBLEM_TYPES:-standard-io@1,output-only@1}

      # **Read once, at the first registration, and never again.** A Runner that
      # could re-declare its tags would put itself into an examination's pool
      # with nobody approving it. Empty means the general pool.
      AJ_Runner__Tags: ${RUNNER_TAGS:-}

      # **The language images, which have no working default here.** Compiled in,
      # the Runner looks for `algojudge/lang-*:local` — images the development
      # flow builds and a fresh host has never heard of. A submission then fails
      # to be judged with nothing obviously wrong.
      AJ_Sandbox__Image__Gcc: ${REGISTRY:-ghcr.io/algojudge}/lang-gcc:${RUNNER_TAG:-0}
      AJ_Sandbox__Image__Clang: ${REGISTRY:-ghcr.io/algojudge}/lang-clang:${RUNNER_TAG:-0}
      AJ_Sandbox__Image__Python: ${REGISTRY:-ghcr.io/algojudge}/lang-python:${RUNNER_TAG:-0}
      AJ_Sandbox__Image__Pypy: ${REGISTRY:-ghcr.io/algojudge}/lang-pypy:${RUNNER_TAG:-0}

      AJ_Work__Path: /var/lib/algojudge-runner/work

      # **As the *daemon* sees it, not as the Runner does.** The Runner asks the
      # daemon to mount this into each job container, and a path the daemon
      # cannot open produces an **empty directory** rather than an error — so
      # every job silently runs against nothing. It must equal the host side of
      # the bind mount below, which is why both come from one variable.
      AJ_Work__HostPath: ${RUNNER_WORK_DIR:?RUNNER_WORK_DIR is required and must be an absolute host path — see .env.example}/runner-1

      RUST_LOG: ${RUNNER_LOG:-info}

    volumes:
      # **The identity key, and losing it costs a re-registration and a manual
      # approval.** A named volume, so it survives `down` and an image change.
      - runner-1-identity:/var/lib/algojudge-runner
      - runner-cache:/var/cache/algojudge-runner
      - ${RUNNER_WORK_DIR:?RUNNER_WORK_DIR is required and must be an absolute host path — see .env.example}/runner-1:/var/lib/algojudge-runner/work
      # The Runner starts **sibling** containers through the daemon. Job
      # containers never get the socket themselves.
      - /var/run/docker.sock:/var/run/docker.sock
      # **Writable, and this is what closes O-14.** Each job container is
      # started under a cgroup that outlives it, and `memory.peak` and
      # `cpu.stat` are read back once the child is gone — a container's own
      # cgroup does not outlive it, and the runtime API reports no peak on v2.
      # Without this the stack would not judge at all: a time limit is decided
      # on the processor time that read produces.
      #
      # **No daemon reconfiguration.** Which cgroup this is depends on the
      # daemon's cgroup driver — a directory the Runner makes under `cgroupfs`,
      # a slice systemd owns under `systemd` — and the Runner chooses at start
      # from what the daemon reports. `systemd` is the default on virtually
      # every host this stack is installed on, and both are supported.
      #
      # **Cheaper than it looks**: this is write permission on one directory
      # tree, not a capability. Nothing here is privileged and no job container
      # ever sees this mount.
      #
      # `cgroup: host` below matters as much as the mount. Without it this
      # container sees its own cgroup as the root, and the path it reads is not
      # the path the daemon resolved `--cgroup-parent` against.
      - /sys/fs/cgroup:/sys/fs/cgroup

    cgroup: host

    # **Root, and the cgroup tree is why.** Both ways of measuring write in the
    # host's cgroup tree — a directory under `cgroupfs`, the `memory.peak` reset
    # under `systemd` — and that tree's directories are root's. The image runs
    # as `nonroot`, and the two backends lose different things without this:
    # under `cgroupfs` the Runner **refuses to start**, and under `systemd` it
    # starts, judges correctly and reports no peak memory, saying so at `ERROR`
    # on every start. Measured on all four combinations, 2026-09-03.
    #
    # **It costs less than it reads.** This container holds the Docker socket,
    # which is root-equivalent on the host by itself, so the uid inside it was
    # never the boundary; `docs/OPERATIONS.md` says what follows from that and
    # when to put Runners on a machine of their own. Nothing it *starts* gains
    # anything: a job container still runs as 65534:65534 with every capability
    # dropped and no socket.
    user: "0:0"

    # **The group, not root.** The image runs as `nonroot`; on a Linux host the
    # socket is `root:docker` mode 660, so adding the group keeps the process
    # unprivileged. `docs/INSTALL.md` says how to find the id, and
    # `docs/OPERATIONS.md` states plainly what socket access is worth to somebody
    # who gets it.
    group_add:
      - ${DOCKER_GID:-999}

    # **Long enough for the Runner to say what it is doing.** On `SIGTERM` it
    # stops the evaluation in hand, gives the job back so another Runner can
    # take it at once, and clears the containers it had started. That is a
    # handful of HTTP calls and a few container removals -- seconds, not
    # minutes -- but a grace shorter than they take is a kill, and a killed
    # Runner leaves the job to its lease, which is ten minutes of a
    # participant's time.
    stop_grace_period: ${RUNNER_STOP_GRACE:-30s}

    # **Which processors this Runner may use, and it is a correctness setting
    # rather than a tuning one.** Empty is the safe default: the Runner reads its
    # own affinity, finds it may use the whole machine, and pins nothing -- the
    # host's scheduler then places every job, which is the right answer when
    # nobody has divided the machine up.
    #
    # Set it and the Runner hands that same set to every job container, because a
    # job container is the daemon's child and inherits no affinity of its own.
    # **One Runner per physical core, both of that core's threads**: `0,1` here,
    # `2,3` next door. A core's two threads share their caches, so a job moving
    # between them costs nothing, and no other Runner is on that core to take its
    # execution units.
    #
    # **Read the pairs from the machine rather than assuming them.**
    # `/sys/devices/system/cpu/cpu0/topology/thread_siblings_list` names cpu0's
    # partner -- `0-1` on one host and `0,8` on another -- and a list written for
    # the first is exactly wrong on the second.
    cpuset: ${RUNNER_1_CPUSET:-}

    networks:
      - runner


  # **The other three, and they differ in four things only**: their name, their
  # identity, their scratch and their processors. Everything else is `<<:
  # *runner`, so what is written above governs all four and cannot drift.
  #
  # **Four is the reference, not a minimum.** It suits a machine with eight
  # physical cores, leaving four for the Server, the database, the daemon and the
  # operating system. On a smaller host, run fewer: more Runners than physical
  # cores does not judge faster and does stop judging accurately.
  runner-2:
    <<: *runner
    environment:
      <<: *runner-env
      AJ_Runner__Name: ${RUNNER_NAME_PREFIX:-runner}-2
      AJ_Work__HostPath: ${RUNNER_WORK_DIR:?RUNNER_WORK_DIR is required and must be an absolute host path — see .env.example}/runner-2
    volumes:
      - runner-2-identity:/var/lib/algojudge-runner
      - runner-cache:/var/cache/algojudge-runner
      - ${RUNNER_WORK_DIR:?RUNNER_WORK_DIR is required and must be an absolute host path — see .env.example}/runner-2:/var/lib/algojudge-runner/work
      - /var/run/docker.sock:/var/run/docker.sock
      - /sys/fs/cgroup:/sys/fs/cgroup
    cpuset: ${RUNNER_2_CPUSET:-}

  runner-3:
    <<: *runner
    environment:
      <<: *runner-env
      AJ_Runner__Name: ${RUNNER_NAME_PREFIX:-runner}-3
      AJ_Work__HostPath: ${RUNNER_WORK_DIR:?RUNNER_WORK_DIR is required and must be an absolute host path — see .env.example}/runner-3
    volumes:
      - runner-3-identity:/var/lib/algojudge-runner
      - runner-cache:/var/cache/algojudge-runner
      - ${RUNNER_WORK_DIR:?RUNNER_WORK_DIR is required and must be an absolute host path — see .env.example}/runner-3:/var/lib/algojudge-runner/work
      - /var/run/docker.sock:/var/run/docker.sock
      - /sys/fs/cgroup:/sys/fs/cgroup
    cpuset: ${RUNNER_3_CPUSET:-}

  runner-4:
    <<: *runner
    environment:
      <<: *runner-env
      AJ_Runner__Name: ${RUNNER_NAME_PREFIX:-runner}-4
      AJ_Work__HostPath: ${RUNNER_WORK_DIR:?RUNNER_WORK_DIR is required and must be an absolute host path — see .env.example}/runner-4
    volumes:
      - runner-4-identity:/var/lib/algojudge-runner
      - runner-cache:/var/cache/algojudge-runner
      - ${RUNNER_WORK_DIR:?RUNNER_WORK_DIR is required and must be an absolute host path — see .env.example}/runner-4:/var/lib/algojudge-runner/work
      - /var/run/docker.sock:/var/run/docker.sock
      - /sys/fs/cgroup:/sys/fs/cgroup
    cpuset: ${RUNNER_4_CPUSET:-}

  # ── The External Runner ─────────────────────────────────────────────────────
  #
  # **Its own profile, outside the default set**: it signs in to an external
  # judging system under an account there, and an installation without one must
  # not get a container that cannot authenticate. An addition to any arrangement,
  # not a fifth one.

  external-runner:
    profiles: ["external-runner"]
    image: ${REGISTRY:-ghcr.io/algojudge}/algojudge-external-runner:${EXTERNAL_RUNNER_TAG:-0}
    logging: *logging
    restart: unless-stopped

    # No `depends_on`: this profile must start where there is no `server`
    # service. It retries its own registration.

    environment:
      # Must carry `/api/v1`; it refuses at startup without it.
      AJ_Server__BaseUrl: ${SERVER_URL:-http://server:8080}/api/v1

      # Not `RUNNER_NAME`: a second Runner, with its own identity and approval.
      AJ_Runner__Name: ${EXTERNAL_RUNNER_NAME:-external-runner-1}

      # One process serves one judge. An unrecognised name is refused at startup.
      AJ_External__Judge: ${EXTERNAL_JUDGE:-uva}

      # **`:-` and not `:?`**: Compose interpolates the whole file before it
      # applies profiles, so a required marker here would break every arrangement
      # that never runs this service. `scripts/preflight.sh` refuses them
      # instead, and only when this service is selected.
      AJ_External__Username: ${EXTERNAL_JUDGE_USERNAME:-}
      AJ_External__Password: ${EXTERNAL_JUDGE_PASSWORD:-}

      # Empty declares the judge's own type. A typo is silence, not an error:
      # the Server pairs by string equality.
      AJ_Runner__ProblemTypes: ${EXTERNAL_PROBLEM_TYPES:-}

      # Read once, at the first registration. Empty is the general pool.
      AJ_Runner__Tags: ${EXTERNAL_RUNNER_TAGS:-}

      RUST_LOG: ${EXTERNAL_RUNNER_LOG:-info}

      # The lease, the four poll intervals **and `AJ_Poll__WaitSeconds`** check
      # one another at startup, and the image's defaults satisfy all of it, so
      # they are not offered here. Moving them costs a solution submitted to the
      # archive twice.
      #
      # The wait is in that arithmetic since 2026-09-04: a lease is renewed once
      # per loop and the claim the Server holds open is inside the same loop, so
      # the cycle is the judge's interval *plus* the wait. A value accepted
      # before that day can be refused now.

    volumes:
      # The identity key. Losing it costs a re-registration and an approval.
      - external-runner-identity:/var/lib/algojudge-external-runner
      # Participants' source text, bounded by the image at 256 MiB.
      - external-runner-cache:/var/cache/algojudge-external-runner

    # It dials out to the Server and to the judging system, and accepts nothing:
    # no port, no listener, no Docker socket, no work directory.
    networks:
      - runner

    # **No health check is possible** — `distroless/static`, no shell, no port —
    # so `up --wait` calls it ready while it may still be failing to sign in. Its
    # log is the only instrument.
    #
    # **Longer than the sandboxing Runner's, and for a different reason.** That
    # one holds a single job; this one holds up to `AJ_External__MaxPending`
    # submissions the archive has not answered for, and on `SIGTERM` it hands
    # every one of them back to the queue — one call each, over the network,
    # against a Server that may be busy. Cut it short and the ones it did not
    # reach wait out their leases instead. What is lost either way is the answers
    # still coming from the archive, which is a duplicate submission on somebody
    # else's service; `docs/OPERATIONS.md` says what that costs.
    stop_grace_period: ${EXTERNAL_RUNNER_STOP_GRACE:-60s}

# ── Networks ──────────────────────────────────────────────────────────────────
#
# Three, so that the database is not reachable from the edge and evaluation
# traffic is separable from HTTP.

networks:
  # **A fixed subnet, because the Server has to be told whose word to take for a
  # visitor's address.** Left to Docker this is whatever was free, so
  # `AJ_Forwarded__KnownNetworks` could not name it and would have to trust
  # everything or nothing. Change both this and `TRUSTED_PROXY_NETWORKS` together
  # if it collides with something on the host — and write a network address, not
  # a host one: a CIDR with host bits set is refused by name at startup.
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.28.0.0/24}
  backend:
  runner:

volumes:
