version: 2

# compose.yaml names every image through a variable with a default, such as
# postgres:${POSTGRES_TAG:-18}, and Dependabot reads none of them. A
# docker-compose entry here finds no dependencies, so there is none: the
# PostgreSQL and nginx tags are not watched by Dependabot.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
