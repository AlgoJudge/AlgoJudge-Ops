name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: The repository says what it should
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the secrets, the variables, the volume and the proxy rules
        run: python3 scripts/check-repository.py

      - name: Every script parses
        # `bash -n` rather than a linter. There is no shellcheck anywhere in this
        # project, and adding one here would gate this repository on a rule the
        # other ten do not follow.
        run: |
          for script in scripts/*.sh scripts/lib/*.sh; do
              bash -n "$script" || exit 1
          done
          echo "$(ls scripts/*.sh scripts/lib/*.sh | wc -l) scripts parse."

  topologies:
    name: All four arrangements resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: A .env with the three values that have no default
        # Throwaway, and named for what they are. Nothing here reads a repository
        # secret and nothing needs one: what is being checked is that the file
        # resolves, not that it deploys.
        run: |
          cp .env.example .env
          sed -i 's|^AJ_ADMIN_TOKEN=.*|AJ_ADMIN_TOKEN=ci-only-not-a-deployment|' .env
          sed -i 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=ci-only-not-a-deployment|' .env
          sed -i 's|^RUNNER_WORK_DIR=.*|RUNNER_WORK_DIR=/tmp/algojudge-runner-work|' .env

      - name: Each topology resolves to the services it should
        # `config` is the whole check here: it expands every variable, applies the
        # profiles and refuses an unset required one. It caught a `${VAR:?}` whose
        # message contained a character that broke the parse.
        run: |
          set -eu
          check() {
              expected=$2
              actual=$(COMPOSE_PROFILES="$1" docker compose config --services | sort | tr '\n' ' ')
              actual=${actual% }
              [ "$actual" = "$expected" ] || {
                  echo "profiles '$1' gave '$actual', expected '$expected'" >&2
                  exit 1
              }
              echo "  $1 -> $actual"
          }
          check "edge,app,data,runner" "client nginx postgres runner server"
          check "edge,app,data"        "client nginx postgres server"
          check "runner"               "runner"
          check "app,data"             "client postgres server"

          # The External Runner is an addition to any arrangement, so the four
          # above must be unchanged by it — and it has to stand alone on a host
          # of its own, exactly as `runner` does two lines up. The second check
          # is the one that would catch a `depends_on` added to it in passing.
          check "edge,app,data,runner,external-runner"                 "client external-runner nginx postgres runner server"
          check "external-runner"      "external-runner"

      - name: nginx accepts the configuration
        # Started rather than linted, which is this project's house answer for
        # configuration: the four defects found in this file while it was being
        # written were all things a parser accepts and nginx refuses — a duplicate
        # `proxy_read_timeout` among them.
        #
        # `--add-host` because nginx **resolves every upstream while parsing**,
        # so outside the Compose network this fails with `host not found in
        # upstream "server:8080"` on a configuration that is perfectly correct.
        # It never connects to them; it only has to be able to look them up.
        run: |
          ./scripts/render-tls.sh ci.invalid
          docker run --rm \
            --add-host server:127.0.0.1 \
            --add-host client:127.0.0.1 \
            -v "$PWD/nginx/algojudge.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/nginx/snippets:/etc/nginx/snippets:ro" \
            -v "$PWD/certs:/etc/nginx/certs:ro" \
            nginx:1.27-alpine nginx -t

  # **The job that would be worth most is not here yet, and this says so rather
  # than pretending.** Bringing the stack up and asserting against it is how this
  # project checks configuration everywhere else — and it is how every defect in
  # this repository was found while it was written. It needs published images,
  # and nothing has been pushed to ghcr.io/algojudge: no repository carries a
  # `v*` tag, so `algojudge-server:1` resolves to nothing.
  #
  # It lands with the first release, together with the one-time flip of the seven
  # packages to public. Until then the stack is verified by hand against images
  # built and tagged locally — `docs/OPERATIONS.md` says how, and the pull request
  # that created this repository records what that run showed.
